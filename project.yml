name: Rex
options:
  bundleIdPrefix: com.rex
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Rex:
    type: application
    platform: macOS
    sources:
      - path: Rex
        excludes:
          - Resources/Info.plist
          - Rex-Bridging-Header.h
      - path: Rex/Resources
        buildPhase: resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rex.app
        PRODUCT_NAME: Rex
        INFOPLIST_FILE: Rex/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_OBJC_BRIDGING_HEADER: Rex/Rex-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: YES
    scheme:
      testTargets:
        - RexTests
  RexTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - RexTests
    dependencies:
      - target: Rex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rex.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Rex.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Rex"
        BUNDLE_LOADER: "$(TEST_HOST)"
